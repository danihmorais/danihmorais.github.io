name: Ajuste Biblioteca Municipal

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar ajustes
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('BIBLIOTECA-MUNICIPAL')
          frontend = root / 'src' / 'main.tsx'
          backend = root / 'backend' / 'main.py'
          css = root / 'src' / 'styles.css'

          s = frontend.read_text(encoding='utf-8')

          s = s.replace(
              "type Dashboard={livros:number;titulos:number;pessoas:number;emprestados:number;atrasados:number;emprestimos_recentes:Loan[];logs_recentes:Log[]}\n",
              "type Dashboard={livros:number;titulos:number;pessoas:number;emprestados:number;atrasados:number;emprestimos_recentes:Loan[];logs_recentes:Log[]}\ntype Category={id:number;nome:string;livros:number}\n"
          )

          s = s.replace(
              "const [dash,setDash]=useState<Dashboard|null>(null),[books,setBooks]=useState<Book[]>([]),[people,setPeople]=useState<Person[]>([]),[users,setUsers]=useState<User[]>([]),[loans,setLoans]=useState<Loan[]>([]),[logs,setLogs]=useState<Log[]>([])\n",
              "const [dash,setDash]=useState<Dashboard|null>(null),[books,setBooks]=useState<Book[]>([]),[people,setPeople]=useState<Person[]>([]),[users,setUsers]=useState<User[]>([]),[loans,setLoans]=useState<Loan[]>([]),[logs,setLogs]=useState<Log[]>([]),[categories,setCategories]=useState<Category[]>([])\n"
          )

          s = s.replace(
              "const [auth,setAuth]=useState<User|null>(()=>{try{return JSON.parse(localStorage.getItem('biblioteca_user')||'null')}catch{return null}})\n const [section,setSection]=useState<'dashboard'|'livros'|'pessoas'|'emprestimos'|'usuarios'|'logs'>('dashboard')\n",
              "const [auth,setAuth]=useState<User|null>(()=>{try{return JSON.parse(localStorage.getItem('biblioteca_user')||'null')}catch{return null}})\n const [section,setSection]=useState<'dashboard'|'livros'|'pessoas'|'emprestimos'|'usuarios'|'categorias'|'logs'>('dashboard')\n"
          )

          s = s.replace(
              "const [book,setBook]=useState<BookForm>({...emptyBook}),[person,setPerson]=useState<PersonForm>({...emptyPerson}),[userForm,setUserForm]=useState<UserForm>({...emptyUser})\n",
              "const [book,setBook]=useState<BookForm>({...emptyBook}),[person,setPerson]=useState<PersonForm>({...emptyPerson}),[userForm,setUserForm]=useState<UserForm>({...emptyUser}),[categoryName,setCategoryName]=useState(''),[isbnReady,setIsbnReady]=useState(false)\n"
          )

          s = s.replace(
              "useEffect(()=>{if(!auth)return;if(section==='livros')loadBooks();if(section==='pessoas')loadPeople();if(section==='usuarios')loadUsers();if(section==='emprestimos')loadLoans();if(section==='logs')loadLogs()},[section,loanStatus,auth])\n",
              "useEffect(()=>{if(!auth)return;if(section==='livros')loadBooks();if(section==='pessoas')loadPeople();if(section==='usuarios')loadUsers();if(section==='emprestimos')loadLoans();if(section==='categorias')loadCategories();if(section==='logs')loadLogs()},[section,loanStatus,auth])\n"
          )

          s = s.replace(
              " async function loadLogs(){await run(async()=>setLogs(await api<Log[]>(`/api/logs?q=${encodeURIComponent(query)}`)))}\n",
              " async function loadLogs(){await run(async()=>setLogs(await api<Log[]>(`/api/logs?q=${encodeURIComponent(query)}`)))}\n async function loadCategories(){await run(async()=>setCategories(await api<Category[]>('/api/categorias')))}\n"
          )

          s = s.replace(
              " async function saveBook(e:FormEvent){e.preventDefault();await run(async()=>{const r=await api<Book>(editId?`/api/livros/${editId}`:'/api/livros',{method:editId?'PUT':'POST',body:JSON.stringify({...book,ano:book.ano?Number(book.ano):null,quantidade:Number(book.quantidade)})});setModal(null);await loadBooks();await loadDashboard();setNotice(`${editId?'Livro alterado':'Livro cadastrado'}: ${r.codigo}.`)})}\n",
              " async function saveBook(e:FormEvent){e.preventDefault();if(!book.titulo.trim()){setNotice('Informe o título do livro.');return}await run(async()=>{const r=await api<Book>(editId?`/api/livros/${editId}`:'/api/livros',{method:editId?'PUT':'POST',body:JSON.stringify({...book,ano:book.ano?Number(book.ano):null,quantidade:Number(book.quantidade)})});setModal(null);await loadBooks();await loadDashboard();setNotice(`${editId?'Livro alterado':'Livro cadastrado'}: ${r.codigo}.`)})}\n"
          )

          s = s.replace(
              " async function lookupISBN(){if(!book.isbn.trim()){setNotice('Informe o ISBN primeiro.');return}await run(async()=>{const data:any=await api(`/api/livros/buscar-isbn?codigo=${encodeURIComponent(book.isbn.trim())}`);setBook(x=>({...x,titulo:data.titulo||x.titulo,autor:data.autor||x.autor,editora:data.editora||x.editora,ano:data.ano?String(data.ano):x.ano,isbn:data.isbn||x.isbn,categoria:data.categoria||x.categoria,idioma:data.idioma||x.idioma,descricao:data.descricao||x.descricao}));setNotice('Dados do ISBN preenchidos.')})}\n",
              " async function lookupISBN(){if(!book.isbn.trim()){setNotice('Informe o ISBN primeiro.');return}await run(async()=>{const data:any=await api(`/api/livros/buscar-isbn?codigo=${encodeURIComponent(book.isbn.trim())}`);setBook(x=>({...x,titulo:data.titulo||x.titulo,autor:data.autor||x.autor,editora:data.editora||x.editora,ano:data.ano?String(data.ano):x.ano,isbn:data.isbn||x.isbn,idioma:data.idioma||x.idioma,descricao:data.descricao||x.descricao,categoria:data.categoria||x.categoria}));setIsbnReady(true);await loadCategories();setNotice('Dados do ISBN preenchidos. Confira e complete o cadastro.')})}\n"
          )

          s = s.replace(
              " async function refresh(){if(section==='dashboard')await loadDashboard();else if(section==='livros')await loadBooks();else if(section==='pessoas')await loadPeople();else if(section==='usuarios')await loadUsers();else if(section==='emprestimos')await loadLoans();else await loadLogs()}\n",
              " async function saveCategory(){const nome=categoryName.trim();if(!nome){setNotice('Informe o nome da categoria.');return}await run(async()=>{await api('/api/categorias',{method:'POST',body:JSON.stringify({nome})});setCategoryName('');await loadCategories();setNotice('Categoria cadastrada.')})}\n async function editCategory(c:Category){const nome=prompt('Novo nome da categoria:',c.nome);if(nome===null||!nome.trim())return;await run(async()=>{await api(`/api/categorias/${c.id}`,{method:'PUT',body:JSON.stringify({nome:nome.trim()})});await loadCategories();await loadBooks();setNotice('Categoria alterada.')})}\n async function deleteCategory(c:Category){if(c.livros>0){setNotice(`Não é possível excluir a categoria \"${c.nome}\": há ${c.livros} livro(s) vinculado(s).`);return}if(!confirm(`Excluir a categoria \"${c.nome}\"?`))return;await run(async()=>{await api(`/api/categorias/${c.id}`,{method:'DELETE'});await loadCategories();setNotice('Categoria excluída.')})}\n async function refresh(){if(section==='dashboard')await loadDashboard();else if(section==='livros')await loadBooks();else if(section==='pessoas')await loadPeople();else if(section==='usuarios')await loadUsers();else if(section==='emprestimos')await loadLoans();else if(section==='categorias')await loadCategories();else await loadLogs()}\n"
          )

          s = s.replace(
              " const title=section==='dashboard'?'Dashboard':section==='livros'?'Acervo':section==='pessoas'?'Pessoas tomadoras':section==='emprestimos'?'Empréstimos':section==='usuarios'?'Usuários do sistema':'Logs'\n const nav=[['dashboard','Dashboard','▦'],['livros','Acervo','▤'],['pessoas','Tomadores','♙'],['emprestimos','Empréstimos','↔'],['usuarios','Usuários','♙'],['logs','Logs','◷']] as const\n",
              " const title=section==='dashboard'?'Dashboard':section==='livros'?'Acervo':section==='pessoas'?'Pessoas tomadoras':section==='emprestimos'?'Empréstimos':section==='usuarios'?'Usuários do sistema':section==='categorias'?'Categorias':'Logs'\n const nav=[['dashboard','Dashboard','▦'],['livros','Acervo','▤'],['pessoas','Tomadores','♙'],['emprestimos','Empréstimos','↔'],['usuarios','Usuários','♙'],['categorias','Categorias','◫'],['logs','Logs','◷']] as const\n"
          )

          s = s.replace(
              "return <div className=\"app-shell\"><aside className=\"sidebar\"><div className=\"brand\"><div className=\"brand-mark\">📚</div><div><strong>Biblioteca Municipal</strong><span>Carlos Eduardo Telles</span></div></div>",
              "return <div className=\"app-shell\"><aside className=\"sidebar\"><div className=\"brand\"><div className=\"brand-mark\">📚</div><div><strong>Biblioteca Municipal</strong><span>Carlos Eduardo Telles</span></div></div>"
          )

          s = s.replace(
              "{section==='logs'&&<><Toolbar query={query} setQuery={setQuery} onSearch={loadLogs}/><Logs logs={logs}/></>}",
              "{section==='categorias'&&<Categories categories={categories} name={categoryName} setName={setCategoryName} onCreate={saveCategory} onEdit={editCategory} onDelete={deleteCategory}/>} {section==='logs'&&<><Toolbar query={query} setQuery={setQuery} onSearch={loadLogs}/><Logs logs={logs}/></>}"
          )

          s = s.replace(
              "<Toolbar query={query} setQuery={setQuery} onSearch={loadBooks} button=\"Novo livro\" onButton={()=>{setEditId(null);setBook({...emptyBook});setModal('book')}}/>",
              "<Toolbar query={query} setQuery={setQuery} onSearch={loadBooks} button=\"Novo livro\" onButton={()=>{setEditId(null);setBook({...emptyBook});setIsbnReady(false);setModal('book')}}/>"
          )

          s = s.replace(
              "onEdit={(b:Book)=>{setEditId(b.id);setBook({titulo:b.titulo,autor:b.autor,editora:b.editora,ano:b.ano?String(b.ano):'',isbn:b.isbn,categoria:b.categoria,idioma:b.idioma,quantidade:String(b.quantidade),localizacao:b.localizacao,descricao:b.descricao});setModal('book')}}",
              "onEdit={(b:Book)=>{setEditId(b.id);setBook({titulo:b.titulo,autor:b.autor,editora:b.editora,ano:b.ano?String(b.ano):'',isbn:b.isbn,categoria:b.categoria,idioma:b.idioma,quantidade:String(b.quantidade),localizacao:b.localizacao,descricao:b.descricao});setIsbnReady(true);setModal('book')}}"
          )

          old = "{modal==='book'&&<Modal title={editId?'Editar livro':'Cadastrar livro'} close={()=>setModal(null)}><form onSubmit={saveBook}><div className=\"form-grid\"><Field label=\"Título *\"><input required value={book.titulo} onChange={e=>setBook({...book,titulo:e.target.value})}/></Field><Field label=\"Autor\"><input value={book.autor} onChange={e=>setBook({...book,autor:e.target.value})}/></Field><Field label=\"Editora\"><input value={book.editora} onChange={e=>setBook({...book,editora:e.target.value})}/></Field><Field label=\"Ano\"><input type=\"number\" min=\"1000\" max=\"2100\" value={book.ano} onChange={e=>setBook({...book,ano:e.target.value})}/></Field><Field label=\"ISBN\"><div className=\"inline\"><input value={book.isbn} onChange={e=>setBook({...book,isbn:e.target.value})}/><button type=\"button\" onClick={lookupISBN}>Buscar</button><button type=\"button\" onClick={startScanner}>📷</button></div></Field><Field label=\"Categoria\"><input value={book.categoria} onChange={e=>setBook({...book,categoria:e.target.value})}/></Field><Field label=\"Idioma\"><input value={book.idioma} onChange={e=>setBook({...book,idioma:e.target.value})}/></Field><Field label=\"Quantidade\"><input type=\"number\" min=\"1\" value={book.quantidade} onChange={e=>setBook({...book,quantidade:e.target.value})}/></Field><Field label=\"Localização\"><input value={book.localizacao} onChange={e=>setBook({...book,localizacao:e.target.value})}/></Field><Field label=\"Descrição\"><textarea value={book.descricao} onChange={e=>setBook({...book,descricao:e.target.value})}/></Field></div><button className=\"primary\">Salvar livro</button></form></Modal>}"
          new = "{modal==='book'&&<Modal title={editId?'Editar livro':'Cadastrar livro'} close={()=>setModal(null)} notice={notice}><form onSubmit={saveBook}><Field label=\"ISBN *\"><div className=\"isbn-start\"><input required value={book.isbn} placeholder=\"Digite ou escaneie o ISBN\" onChange={e=>{setBook({...book,isbn:e.target.value});setIsbnReady(false)}}/><button type=\"button\" onClick={lookupISBN}>Buscar ISBN</button><button type=\"button\" onClick={startScanner}>📷</button></div></Field>{isbnReady&&<><div className=\"form-grid\"><Field label=\"Título *\"><input required value={book.titulo} onChange={e=>setBook({...book,titulo:e.target.value})}/></Field><Field label=\"Autor\"><input value={book.autor} onChange={e=>setBook({...book,autor:e.target.value})}/></Field><Field label=\"Editora\"><input value={book.editora} onChange={e=>setBook({...book,editora:e.target.value})}/></Field><Field label=\"Ano\"><input type=\"number\" min=\"1000\" max=\"2100\" value={book.ano} onChange={e=>setBook({...book,ano:e.target.value})}/></Field><Field label=\"Categoria\"><select value={book.categoria} onChange={e=>setBook({...book,categoria:e.target.value})}><option value=\"\">Selecione</option>{categories.map(c=><option value={c.nome} key={c.id}>{c.nome}</option>)}</select></Field><Field label=\"Idioma\"><input value={book.idioma} onChange={e=>setBook({...book,idioma:e.target.value})}/></Field><Field label=\"Quantidade\"><input type=\"number\" min=\"1\" value={book.quantidade} onChange={e=>setBook({...book,quantidade:e.target.value})}/></Field><Field label=\"Localização\"><input value={book.localizacao} onChange={e=>setBook({...book,localizacao:e.target.value})}/></Field><Field label=\"Descrição\"><textarea value={book.descricao} onChange={e=>setBook({...book,descricao:e.target.value})}/></Field></div><button className=\"primary\">Salvar livro</button></>}</form></Modal>}"
          if old not in s:
              raise SystemExit('Bloco do modal de livro não encontrado')
          s = s.replace(old, new)

          s = s.replace(
              "{modal==='person'&&<Modal title={editId?'Editar pessoa':'Nova pessoa'} close={()=>setModal(null)}><form",
              "{modal==='person'&&<Modal title={editId?'Editar pessoa':'Nova pessoa'} close={()=>setModal(null)} notice={notice}><form"
          )
          s = s.replace(
              "{modal==='user'&&<Modal title={editId?'Editar usuário':'Novo usuário'} close={()=>setModal(null)}><form",
              "{modal==='user'&&<Modal title={editId?'Editar usuário':'Novo usuário'} close={()=>setModal(null)} notice={notice}><form"
          )
          s = s.replace(
              "{modal==='loan'&&<Modal title=\"Novo empréstimo por exemplar\" close={()=>setModal(null)}><form",
              "{modal==='loan'&&<Modal title=\"Novo empréstimo por exemplar\" close={()=>setModal(null)} notice={notice}><form"
          )

          s = s.replace(
              "function Empty({text}:{text:string}){return <div className=\"empty\">{text}</div>}\nfunction Field",
              "function Categories({categories,name,setName,onCreate,onEdit,onDelete}:{categories:Category[];name:string;setName:(v:string)=>void;onCreate:()=>Promise<void>;onEdit:(c:Category)=>Promise<void>;onDelete:(c:Category)=>Promise<void>}){return <div className=\"category-page\"><div className=\"card category-form\"><h2>Nova categoria</h2><div className=\"inline\"><input value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')onCreate()}} placeholder=\"Ex.: Literatura\"/><button className=\"primary\" onClick={onCreate}>Cadastrar</button></div></div><div className=\"list\">{categories.length===0?<Empty text=\"Nenhuma categoria cadastrada.\"/>:categories.map(c=><div className=\"row\" key={c.id}><div><b>{c.nome}</b><small>{c.livros} livro(s) vinculado(s)</small></div><div className=\"actions\"><button onClick={()=>onEdit(c)}>Editar</button><button onClick={()=>onDelete(c)} disabled={c.livros>0}>Excluir</button></div></div>)}</div></div>}\nfunction Empty({text}:{text:string}){return <div className=\"empty\">{text}</div>}\nfunction Field"
          )

          s = s.replace(
              "function Modal({title,close,children}:{title:string;close:()=>void;children:any}){return <div className=\"back\" onMouseDown={e=>{if(e.target===e.currentTarget)close()}}><div className=\"modal\"><header><h2>{title}</h2><button type=\"button\" onClick={close}>×</button></header>{children}</div></div>}\n",
              "function Modal({title,close,children,notice}:{title:string;close:()=>void;children:any;notice?:string}){return <div className=\"back\" onMouseDown={e=>{if(e.target===e.currentTarget)close()}}><div className=\"modal\"><header><h2>{title}</h2><button type=\"button\" onClick={close}>×</button></header>{notice&&<div className=\"notice modal-notice\">{notice}</div>}{children}</div></div>}\n"
          )

          frontend.write_text(s, encoding='utf-8')

          b = backend.read_text(encoding='utf-8')
          b = b.replace(
              "CREATE TABLE IF NOT EXISTS livros (\n",
              "CREATE TABLE IF NOT EXISTS categorias (\n      id INTEGER PRIMARY KEY AUTOINCREMENT,\n      nome TEXT UNIQUE NOT NULL,\n      criado_em TEXT NOT NULL,\n      atualizado_em TEXT NOT NULL\n    );\n    CREATE TABLE IF NOT EXISTS livros (\n"
          )
          b = b.replace(
              "    conn.commit()\n    conn.close()\n    ensure_bootstrap_file()\n",
              "    conn.commit()\n    rows = conn.execute(\"SELECT DISTINCT TRIM(categoria) categoria FROM livros WHERE TRIM(COALESCE(categoria,'')) <> ''\").fetchall()\n    t = now_iso()\n    for row in rows:\n        conn.execute(\"INSERT OR IGNORE INTO categorias(nome,criado_em,atualizado_em) VALUES(?,?,?)\", (row['categoria'], t, t))\n    conn.commit()\n    conn.close()\n    ensure_bootstrap_file()\n"
          )
          b = b.replace(
              "@app.post(\"/api/livros\")\n",
              "@app.get(\"/api/categorias\")\ndef list_categorias(user=Depends(current_user)):\n    conn=db()\n    rows=conn.execute(\"SELECT c.id,c.nome,COUNT(l.id) livros FROM categorias c LEFT JOIN livros l ON l.ativo=1 AND l.categoria=c.nome GROUP BY c.id,c.nome ORDER BY c.nome COLLATE NOCASE\").fetchall()\n    conn.close()\n    return [row_dict(r) for r in rows]\n\n\nclass CategoriaIn(BaseModel):\n    nome: str = Field(min_length=1, max_length=120)\n\n\n@app.post(\"/api/categorias\")\ndef create_categoria(data: CategoriaIn, user=Depends(current_user)):\n    if user[\"perfil\"] != \"Administrador\": raise HTTPException(403, \"Somente administradores podem gerenciar categorias.\")\n    nome=data.nome.strip()\n    conn=db()\n    try:\n        t=now_iso(); cur=conn.execute(\"INSERT INTO categorias(nome,criado_em,atualizado_em) VALUES(?,?,?)\",(nome,t,t)); log(conn,'CRIAR','categoria',cur.lastrowid,f\"Categoria cadastrada: {nome}\"); conn.commit(); r=conn.execute(\"SELECT c.id,c.nome,0 livros FROM categorias c WHERE c.id=?\",(cur.lastrowid,)).fetchone(); conn.close(); return row_dict(r)\n    except sqlite3.IntegrityError:\n        conn.close(); raise HTTPException(409, \"Já existe uma categoria com esse nome.\")\n\n\n@app.put(\"/api/categorias/{categoria_id}\")\ndef update_categoria(categoria_id: int, data: CategoriaIn, user=Depends(current_user)):\n    if user[\"perfil\"] != \"Administrador\": raise HTTPException(403, \"Somente administradores podem gerenciar categorias.\")\n    nome=data.nome.strip(); conn=db(); old=conn.execute(\"SELECT * FROM categorias WHERE id=?\",(categoria_id,)).fetchone()\n    if not old: conn.close(); raise HTTPException(404, \"Categoria não encontrada.\")\n    try:\n        conn.execute(\"UPDATE categorias SET nome=?, atualizado_em=? WHERE id=?\",(nome,now_iso(),categoria_id))\n        conn.execute(\"UPDATE livros SET categoria=?, atualizado_em=? WHERE categoria=?\",(nome,now_iso(),old['nome']))\n        log(conn,'ALTERAR','categoria',categoria_id,f\"Categoria alterada: {old['nome']} → {nome}\")\n        conn.commit(); r=conn.execute(\"SELECT c.id,c.nome,COUNT(l.id) livros FROM categorias c LEFT JOIN livros l ON l.ativo=1 AND l.categoria=c.nome WHERE c.id=? GROUP BY c.id,c.nome\",(categoria_id,)).fetchone(); conn.close(); return row_dict(r)\n    except sqlite3.IntegrityError:\n        conn.rollback(); conn.close(); raise HTTPException(409, \"Já existe uma categoria com esse nome.\")\n\n\n@app.delete(\"/api/categorias/{categoria_id}\")\ndef delete_categoria(categoria_id: int, user=Depends(current_user)):\n    if user[\"perfil\"] != \"Administrador\": raise HTTPException(403, \"Somente administradores podem gerenciar categorias.\")\n    conn=db(); row=conn.execute(\"SELECT * FROM categorias WHERE id=?\",(categoria_id,)).fetchone()\n    if not row: conn.close(); raise HTTPException(404, \"Categoria não encontrada.\")\n    vinculados=conn.execute(\"SELECT COUNT(*) v FROM livros WHERE ativo=1 AND categoria=?\",(row['nome'],)).fetchone()['v']\n    if vinculados:\n        conn.close(); raise HTTPException(409, f\"Não é possível excluir a categoria: há {vinculados} livro(s) vinculado(s).\")\n    conn.execute(\"DELETE FROM categorias WHERE id=?\",(categoria_id,)); log(conn,'EXCLUIR','categoria',categoria_id,f\"Categoria excluída: {row['nome']}\"); conn.commit(); conn.close(); return {\"ok\":True}\n\n\n@app.post(\"/api/livros\")\n"
          )
          backend.write_text(b, encoding='utf-8')

          css_text = css.read_text(encoding='utf-8')
          css_text += "\n.modal-notice{margin:0 20px 14px}.isbn-start{display:grid;grid-template-columns:1fr auto auto;gap:8px}.category-page{display:grid;gap:18px}.category-form{padding:20px}.category-page>.list .actions button:disabled{opacity:.45;cursor:not-allowed}\n"
          css.write_text(css_text, encoding='utf-8')
          PY

          git config user.name github-actions
          git config user.email github-actions@github.com
          git add BIBLIOTECA-MUNICIPAL/src/main.tsx BIBLIOTECA-MUNICIPAL/backend/main.py BIBLIOTECA-MUNICIPAL/src/styles.css
          git commit -m "Corrige modais, cadastro por ISBN e categorias" || true
          git push
          git rm .github/workflows/biblioteca-fix.yml || true
          git commit -m "Remove workflow temporário de ajuste" || true
          git push || true
