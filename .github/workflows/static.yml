name: Deploy static content to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            MONTAEDITAL/package-lock.json
            LICITA.AI/package-lock.json
            EMAIL-ATAS-CONTRATOS/package-lock.json
            GERADOREXTRATO/package-lock.json
      - name: Build MontaEdital
        working-directory: ./MONTAEDITAL
        env:
          VITE_API_URL: ${{ secrets.API_URL }}
        run: |
          npm install
          npm run build
      - name: Build Licita.AI
        working-directory: ./LICITA.AI
        env:
          VITE_API_URL: ${{ secrets.API_URL }}
          VITE_API_UNSLOTH_KEY: ${{ secrets.API_UNSLOTH }}
          VITE_API_OPENROUTER_KEY: ${{ secrets.API_OPENROUTER }}
        run: |
          npm install
          npm run build
      - name: Build Enviador de Atas e Contratos
        working-directory: ./EMAIL-ATAS-CONTRATOS
        env:
          VITE_API_URL: ${{ secrets.API_URL }}
        run: |
          npm install
          npm run build
      - name: Build Gerador de Extrato de Atas e Contratos
        working-directory: ./GERADOREXTRATO
        env:
          VITE_API_URL: ${{ secrets.API_URL }}
        run: |
          npm install
          npm run build
      - name: Assemble final site
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          mkdir -p site
          cp index.html site/
          cp ads.txt site/
          cp -r assets site/
          cp -r MONTAEDITAL/dist site/MONTAEDITAL
          cp -r LICITA.AI/dist site/LICITA.AI
          cp -r EMAIL-ATAS-CONTRATOS/dist site/EMAIL-ATAS-CONTRATOS
          cp -r GERADOREXTRATO/dist site/GERADOREXTRATO
          cp -r FIORIILICSVTOWORD/. site/FIORIILICSVTOWORD/
          cp documentos-modelo.html site/documentos-modelo.html
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path("site/documentos-modelo.html")
          content = path.read_text(encoding="utf-8")
          api_url = os.environ.get("API_URL", "").rstrip("/")
          if not api_url:
              raise SystemExit("O secret API_URL não foi configurado.")
          path.write_text(content.replace("__API_URL__", api_url), encoding="utf-8")
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
