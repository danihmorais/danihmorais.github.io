name: Deploy static content to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            MONTAEDITAL/package-lock.json
            LICITA.AI/package-lock.json
            EMAIL-ATAS-CONTRATOS/package-lock.json
            GERADOREXTRATO/package-lock.json
      - name: Build MontaEdital
        working-directory: ./MONTAEDITAL
        env:
          VITE_API_URL: ${{ secrets.API_URL }}
        run: |
          npm install
          npm run build
      - name: Build Licita.AI
        working-directory: ./LICITA.AI
        env:
          VITE_API_URL: ${{ secrets.API_URL }}
          VITE_API_UNSLOTH_KEY: ${{ secrets.API_UNSLOTH }}
          VITE_API_OPENROUTER_KEY: ${{ secrets.API_OPENROUTER }}
        run: |
          npm install
          npm run build
      - name: Build Enviador de Atas e Contratos
        working-directory: ./EMAIL-ATAS-CONTRATOS
        env:
          VITE_API_URL: ${{ secrets.API_URL }}
        run: |
          npm install
          npm run build
      - name: Build Gerador de Extrato de Atas e Contratos
        working-directory: ./GERADOREXTRATO
        env:
          VITE_API_URL: ${{ secrets.API_URL }}
        run: |
          npm install
          npm run build
      - name: Assemble final site
        env:
          API_URL: ${{ secrets.API_URL }}
          PAGES_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail

          mkdir -p site
          cp index.html site/
          cp ads.txt site/
          cp -r assets site/
          cp -r MONTAEDITAL/dist site/MONTAEDITAL
          cp -r LICITA.AI/dist site/LICITA.AI
          cp -r EMAIL-ATAS-CONTRATOS/dist site/EMAIL-ATAS-CONTRATOS
          cp -r GERADOREXTRATO/dist site/GERADOREXTRATO
          cp -r FIORIILICSVTOWORD/. site/FIORIILICSVTOWORD/
          cp documentos-modelo.html site/documentos-modelo.html

          python - <<'PY'
          from pathlib import Path
          import json
          import os

          api_url = os.environ.get("API_URL", "").strip()
          version = os.environ.get("PAGES_VERSION", "").strip()

          # Aceita tanto https://servidor... quanto "https://servidor..."
          # caso o secret tenha sido salvo acidentalmente com aspas externas.
          if len(api_url) >= 2 and api_url[0] == api_url[-1] and api_url[0] in "\"'":
              api_url = api_url[1:-1].strip()
          api_url = api_url.rstrip("/")

          if not api_url:
              raise SystemExit("O secret API_URL não foi configurado.")
          if not api_url.startswith(("http://", "https://")):
              raise SystemExit("O secret API_URL deve começar com http:// ou https://")
          if not version:
              raise SystemExit("PAGES_VERSION não foi configurado.")

          doc_path = Path("site/documentos-modelo.html")
          doc_content = doc_path.read_text(encoding="utf-8")
          placeholder = "__API_URL_JSON__"
          if placeholder not in doc_content:
              raise SystemExit(f"Placeholder {placeholder} não encontrado em documentos-modelo.html")

          doc_content = doc_content.replace(placeholder, json.dumps(api_url, ensure_ascii=False))
          if placeholder in doc_content:
              raise SystemExit("O placeholder da API_URL permaneceu no HTML após a substituição.")

          doc_path.write_text(doc_content, encoding="utf-8")

          index_path = Path("site/index.html")
          index_content = index_path.read_text(encoding="utf-8")
          if "__PAGES_VERSION__" in index_content:
              index_content = index_content.replace("__PAGES_VERSION__", version)
              index_path.write_text(index_content, encoding="utf-8")
          if "__PAGES_VERSION__" in index_content:
              raise SystemExit("O cache-buster __PAGES_VERSION__ permaneceu no index.html")

          # Validação sintática mínima: a página publicada não pode conter
          # placeholders nem uma declaração de API_URL quebrada.
          published = doc_path.read_text(encoding="utf-8")
          if "__API_URL_JSON__" in published:
              raise SystemExit("Placeholder __API_URL_JSON__ ainda está presente no HTML publicado.")
          if 'const API_URL = ""' in published or "const API_URL = ''" in published:
              raise SystemExit("A declaração da API_URL ficou com aspas duplicadas.")

          print("API_URL aplicada ao site com sucesso.")
          print("Placeholder __API_URL_JSON__: removido")
          print("Cache-buster do index.html: aplicado")
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
