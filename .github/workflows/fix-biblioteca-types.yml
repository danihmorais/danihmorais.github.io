name: Fix Biblioteca TypeScript

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir parâmetro implicitamente any
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('BIBLIOTECA-MUNICIPAL/src/main2.tsx')
          s = p.read_text(encoding='utf-8')
          old = "onExemplares={async id=>{setExemplares(await api(`/api/livros/${id}/exemplares`));setSelected([]);setModal('exemplares')}}"
          new = "onExemplares={async (id:number)=>{setExemplares(await api(`/api/livros/${id}/exemplares`));setSelected([]);setModal('exemplares')}}"
          if old not in s:
              raise SystemExit('Trecho esperado não encontrado; nenhuma alteração feita.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BIBLIOTECA-MUNICIPAL/src/main2.tsx
          git commit -m 'fix: tipar id do callback de exemplares da biblioteca'
          git push
      - name: Remover workflow temporário
        if: success()
        run: |
          git rm .github/workflows/fix-biblioteca-types.yml
          git commit -m 'chore: remover workflow temporário'
          git push
