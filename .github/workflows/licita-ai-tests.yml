name: Test Licita.AI

on:
  pull_request:
    paths:
      - "LICITA.AI/**"
      - ".github/workflows/licita-ai-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: LICITA.AI/package-lock.json

      - name: Test frontend e build
        working-directory: ./LICITA.AI
        run: |
          npm ci
          npm test
          npm run build
          node tests/dist-smoke.mjs

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test backend
        working-directory: ./LICITA.AI
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests/backend -p 'test_*.py' -v
