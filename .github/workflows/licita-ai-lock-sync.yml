name: Sync Licita.AI lockfile

on:
  push:
    branches:
      - fix/licita-ai-guardrails-20260910
    paths:
      - "LICITA.AI/package.json"
      - ".github/workflows/licita-ai-lock-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate lockfile
        working-directory: ./LICITA.AI
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LICITA.AI/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(licita-ai): atualiza lockfile do SheetJS"
          git push
