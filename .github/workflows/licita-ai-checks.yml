name: LICITA.AI checks

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - "LICITA.AI/**"
      - "main.py"
      - ".github/workflows/licita-ai-checks.yml"
      - ".github/workflows/deploy-fastapi.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: LICITA.AI/package-lock.json
      - name: Install frontend dependencies
        working-directory: LICITA.AI
        run: npm ci
      - name: Unit tests
        working-directory: LICITA.AI
        run: npm test
      - name: TypeScript and Vite build
        working-directory: LICITA.AI
        env:
          VITE_API_URL: https://example.invalid
        run: npm run build
      - name: Build smoke test
        working-directory: LICITA.AI
        run: node tests/dist-smoke.mjs

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: LICITA.AI
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run backend tests
        working-directory: LICITA.AI
        run: python -m unittest discover -s tests/backend -p 'test_*.py' -v
