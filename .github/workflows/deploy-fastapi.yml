name: Deploy FastAPI to Ubuntu

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy-fastapi"
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy FastAPI to Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Ubuntu deployment
        env:
          WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          API_URL: ${{ secrets.API_URL }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          PROJECT: DANIHMORAIS-GITHUB-PAGES
        run: |
          set -euo pipefail
          test -n "$WEBHOOK_SECRET" || { echo 'Secret DEPLOY_WEBHOOK_SECRET não configurado.'; exit 1; }
          test -n "$API_URL" || { echo 'Secret API_URL não configurado.'; exit 1; }

          DEPLOY_URL="${API_URL%/}/deploy"
          body=$(jq -nc \
            --arg ref 'refs/heads/main' \
            --arg after "$SHA" \
            --arg repository "$REPOSITORY" \
            --arg project "$PROJECT" \
            '{ref:$ref,after:$after,repository:{full_name:$repository},project:$project}')
          signature=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -hex | awk '{print $2}')

          response=$(curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 --max-time 30 \
            --request POST \
            --url "$DEPLOY_URL" \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Event: push' \
            --header "X-Deploy-Project: $PROJECT" \
            --header "X-Hub-Signature-256: sha256=$signature" \
            --data "$body")

          echo "Deploy remoto iniciado: $response"

      - name: Wait for deployment
        env:
          API_URL: ${{ secrets.API_URL }}
          SHA: ${{ github.sha }}
          PROJECT: DANIHMORAIS-GITHUB-PAGES
        run: |
          set -euo pipefail
          test -n "$API_URL" || { echo 'Secret API_URL não configurado.'; exit 1; }

          STATUS_URL="${API_URL%/}/deploy-status"
          for i in $(seq 1 60); do
            response=$(curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 30 \
              --get --url "$STATUS_URL" \
              --data-urlencode "sha=$SHA" \
              --data-urlencode "project=$PROJECT")
            echo "[$i/60] $response"
            state=$(printf '%s' "$response" | jq -r '.state')
            if [ "$state" = "success" ]; then
              echo "Deploy do $PROJECT concluído com sucesso."
              exit 0
            fi
            if [ "$state" = "failure" ]; then
              echo "Deploy do $PROJECT falhou."
              exit 1
            fi
            sleep 10
          done
          echo "Timeout aguardando o deploy de $PROJECT."
          exit 1

      - name: Validate public API
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          set -euo pipefail
          test -n "$API_URL" || { echo 'Secret API_URL não configurado.'; exit 1; }

          BASE_URL="${API_URL%/}"
          ORIGIN='https://danihmorais.github.io'
          BODY_FILE="$(mktemp)"
          HEADERS_FILE="$(mktemp)"
          trap 'rm -f "$BODY_FILE" "$HEADERS_FILE"' EXIT

          echo 'Validando /health...'
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 30 \
            --header "Origin: $ORIGIN" \
            --output "$BODY_FILE" \
            "$BASE_URL/health"
          python - "$BODY_FILE" <<'PY'
          import json, sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if payload.get("status") != "ok":
              raise SystemExit("/health não retornou status=ok")
          print("/health OK")
          PY

          echo 'Validando namespace do agregador...'
          for endpoint in /licita/openapi.json /monta/openapi.json /email/openapi.json /geradorextrato/openapi.json /estudos/openapi.json; do
            curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 30 \
              --output /dev/null \
              "$BASE_URL$endpoint"
            echo "$endpoint OK"
          done

          echo 'Validando /files e CORS...'
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 30 \
            --header "Origin: $ORIGIN" \
            --dump-header "$HEADERS_FILE" \
            --output "$BODY_FILE" \
            "$BASE_URL/files"
          grep -Eiq '^access-control-allow-origin:[[:space:]]*https://danihmorais\.github\.io[[:space:]]*$' "$HEADERS_FILE" || {
            echo 'CORS não está configurado corretamente em /files.'
            cat "$HEADERS_FILE"
            exit 1
          }
          python - "$BODY_FILE" <<'PY'
          import json, sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          files = payload.get("files") if isinstance(payload, dict) else None
          if not isinstance(files, list):
              raise SystemExit("/files não retornou um objeto JSON com a chave 'files'.")
          print(f"API pública OK: /health, namespaces e /files funcionando; {len(files)} arquivos encontrados.")
          PY
