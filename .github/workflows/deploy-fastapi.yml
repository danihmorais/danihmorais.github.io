name: Deploy FastAPI to Ubuntu

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy-fastapi"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy FastAPI to Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Ubuntu deployment
        env:
          WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          DEPLOY_URL: https://servidor.tail7d4aa4.ts.net/deploy
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          body=$(printf '{"ref":"refs/heads/main","after":"%s"}' "$SHA")
          signature=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -hex | awk '{print $2}')

          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url "$DEPLOY_URL" \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Event: push' \
            --header "X-Hub-Signature-256: sha256=$signature" \
            --data "$body")

          echo "Deploy server respondeu: $response"

      - name: Wait for deployment
        env:
          STATUS_URL: https://servidor.tail7d4aa4.ts.net/deploy-status
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          for i in $(seq 1 60); do
            response=$(curl --fail --silent --show-error \
              --get \
              --url "$STATUS_URL" \
              --data-urlencode "sha=$SHA")

            echo "[$i/60] $response"

            state=$(printf '%s' "$response" | jq -r '.state')

            if [ "$state" = "success" ]; then
              echo "Deploy concluído com sucesso."
              exit 0
            fi

            if [ "$state" = "failure" ]; then
              echo "Deploy falhou."
              exit 1
            fi

            sleep 10
          done

          echo "Timeout aguardando o deploy."
          exit 1
