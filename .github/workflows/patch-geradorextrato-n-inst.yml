name: Patch N.INST Gerador de Extrato

on:
  push:
    paths:
      - '.github/workflows/patch-geradorextrato-n-inst.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar correção
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('GERADOREXTRATO/main.py')
          s = path.read_text(encoding='utf-8')

          # 1) Troca o extrator simples do instrumento por um extrator que
          #    também encontra o número associado ao mesmo bloco textual.
          instrument_block = re.compile(
              r'def instrument\(text\):\n'
              r'    m = INSTRUMENT_RE\.search\(text or ""\)\n'
              r'    return m\.group\(1\)\.capitalize\(\) if m else None\n',
              re.M,
          )
          instrument_new = '''def instrument_info(text):
              """Localiza o tipo de instrumento e o seu número na mesma região textual."""
              text = text or ""
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  m = INSTRUMENT_RE.search(line)
                  if not m:
                      continue

                  instrument_value = m.group(1).capitalize()
                  candidates = [
                      line[m.end():m.end() + 160],
                      line[max(0, m.start() - 100):m.end()],
                  ]
                  if i + 1 < len(lines):
                      candidates.append(lines[i + 1][:160])

                  instrument_number = None
                  for candidate in candidates:
                      n = NUMBER_RE.search(candidate)
                      if n:
                          instrument_number = number(n.group())
                          break
                  return instrument_value, instrument_number
              return None, None

          def instrument(text):
              return instrument_info(text)[0]

          def instrument_number(text):
              return instrument_info(text)[1]

          '''
          s, count = instrument_block.subn(instrument_new, s, count=1)
          if count != 1:
              raise SystemExit('Bloco instrument(text) não encontrado; patch abortado.')

          # 2) Passa a guardar também o número do instrumento na extração.
          old = '    inst = instrument(text) or instrument(raw)\n    contractor_name = contractor(text) or contractor(raw)\n'
          new = '    inst, inst_num = instrument_info(text)\n    if not inst and raw:\n        inst, inst_num = instrument_info(raw)\n    contractor_name = contractor(text) or contractor(raw)\n'
          if old not in s:
              raise SystemExit('Bloco de extração do instrumento não encontrado; patch abortado.')
          s = s.replace(old, new, 1)

          old = '        "detected_instrument": inst,\n        "instrument": inst,\n        "object": obj(text) or obj(raw),\n'
          new = '        "detected_instrument": inst,\n        "instrument": inst,\n        "instrument_number": inst_num,\n        "object": obj(text) or obj(raw),\n'
          if old not in s:
              raise SystemExit('Bloco do resultado de extração não encontrado; patch abortado.')
          s = s.replace(old, new, 1)

          old = '            ("instrumento", "instrument"),\n            ("objeto", "object"),\n'
          new = '            ("instrumento", "instrument"),\n            ("nº do instrumento", "instrument_number"),\n            ("objeto", "object"),\n'
          if old not in s:
              raise SystemExit('Lista de campos obrigatórios não encontrada; patch abortado.')
          s = s.replace(old, new, 1)

          old = '''        if not instrument_value:
            raise ValueError(f"Instrumento não localizado para {item.get('filename', 'fornecedor')}.")
        instruments.append(instrument_value)
'''
          new = '''        if not instrument_value:
            raise ValueError(f"Instrumento não localizado para {item.get('filename', 'fornecedor')}.")
        instrument_number_value = item.get("instrument_number")
        if not instrument_number_value:
            raise ValueError(f"Nº do instrumento não localizado para {item.get('filename', 'fornecedor')}.")
        instruments.append(instrument_value)
'''
          if old not in s:
              raise SystemExit('Validação do instrumento na geração não encontrada; patch abortado.')
          s = s.replace(old, new, 1)

          old = '            "{{N.MODALIDADE}}": item["modality_number"],\n            "{{OBJETO}}": item.get("object", ""),\n'
          new = '            "{{N.MODALIDADE}}": item["modality_number"],\n            "{{N.INST}}": instrument_number_value,\n            "{{OBJETO}}": item.get("object", ""),\n'
          if old not in s:
              raise SystemExit('Mapa de placeholders não encontrado; patch abortado.')
          s = s.replace(old, new, 1)

          old = '                "detected_instrument": None,\n                "instrument": None,\n                "object": None,\n'
          new = '                "detected_instrument": None,\n                "instrument": None,\n                "instrument_number": None,\n                "object": None,\n'
          if old not in s:
              raise SystemExit('Payload de erro do endpoint analyze não encontrado; patch abortado.')
          s = s.replace(old, new, 1)

          path.write_text(s, encoding='utf-8')
          compile(s, str(path), 'exec')
          print('Patch aplicado e main.py compilou corretamente.')

      - name: Verificar alterações
        shell: bash
        run: |
          grep -n 'instrument_number\|{{N.INST}}' GERADOREXTRATO/main.py

      - name: Commit e remover patch temporário
        shell: bash
        run: |
          rm -f .github/workflows/patch-geradorextrato-n-inst.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GERADOREXTRATO/main.py .github/workflows/patch-geradorextrato-n-inst.yml
          git commit -m "Preenche N.INST com número do instrumento" || exit 0
          git push
