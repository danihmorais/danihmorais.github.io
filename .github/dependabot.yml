version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/LICITA.AI"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      vite-tooling:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "typescript"
          - "esbuild"
      testing:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "@typescript-eslint/*"
          - "jsdom"
          - "happy-dom"
  - package-ecosystem: "pip"
    directory: "/LICITA.AI"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      fastapi-stack:
        patterns:
          - "fastapi"
          - "starlette"
          - "uvicorn"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
