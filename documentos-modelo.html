<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentos Modelo | Universo da Licitação</title>
    <link rel="icon" href="./assets/logo.png" type="image/png">

    <style>
        :root {
            --bg: #f4f5f7;
            --card: #fff;
            --text: #1f2430;
            --muted: #6b7280;
            --pri: #2f6f4f;
            --b: #e5e7eb;
            --hover: #f7faf8;
        }

        [data-theme="dark"] {
            --bg: #0b1220;
            --card: #111827;
            --text: #f3f4f6;
            --muted: #94a3b8;
            --pri: #34a06f;
            --b: #243041;
            --hover: #172131;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(180deg, var(--bg), #dfe8e3);
            color: var(--text);
        }

        [data-theme="dark"] body { background: var(--bg); }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }

        .back {
            text-decoration: none;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .back:hover { color: var(--pri); }

        button {
            cursor: pointer;
            border: 2px solid var(--b);
            background: var(--card);
            border-radius: 999px;
            padding: 10px 14px;
            color: var(--text);
        }

        .wrap {
            flex: 1;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px 30px;
        }

        .hero {
            text-align: center;
            padding: 8px 0 24px;
        }

        .hero-logo {
            width: 70px;
            height: 70px;
            margin-bottom: 8px;
        }

        .hero h1 { margin: 0 0 6px; font-size: 1.8rem; }
        .hero p { margin: 0; color: var(--muted); }

        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 14px;
        }

        .toolbar input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 999px;
            border: 2px solid var(--b);
            background: var(--card);
            color: var(--text);
            font-size: 0.95rem;
        }

        .panel {
            background: var(--card);
            border: 2px solid var(--b);
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .tree {
            padding: 8px 0;
        }

        .tree-node + .tree-node {
            border-top: 1px solid rgba(229, 231, 235, 0.55);
        }

        [data-theme="dark"] .tree-node + .tree-node {
            border-top-color: rgba(36, 48, 65, 0.6);
        }

        .tree-row {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 48px;
            padding: 8px 14px;
            transition: background 0.15s ease;
        }

        .tree-row:hover { background: var(--hover); }

        .tree-row.folder {
            cursor: pointer;
            user-select: none;
            font-weight: 600;
        }

        .tree-row .expander {
            width: 22px;
            flex: 0 0 22px;
            color: var(--muted);
            text-align: center;
            font-size: 0.85rem;
        }

        .tree-row .icon {
            width: 25px;
            flex: 0 0 25px;
            text-align: center;
            font-size: 20px;
        }

        .tree-row .name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tree-row .meta {
            color: var(--muted);
            font-size: 0.82rem;
            flex-shrink: 0;
        }

        .tree-row .dl {
            text-decoration: none;
            color: var(--pri);
            font-weight: 600;
            font-size: 0.88rem;
            padding: 6px 12px;
            border: 2px solid var(--pri);
            border-radius: 999px;
            flex-shrink: 0;
        }

        .tree-row .dl:hover {
            background: var(--pri);
            color: #fff;
        }

        .children {
            display: none;
        }

        .children.open {
            display: block;
        }

        .state {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }

        .state .spin {
            font-size: 30px;
            animation: rot 1s linear infinite;
            display: inline-block;
        }

        .error {
            color: #b91c1c;
        }

        @keyframes rot { to { transform: rotate(360deg); } }

        footer {
            text-align: center;
            padding: 20px 0 10px;
            color: var(--muted);
            font-size: 0.85rem;
        }

        @media (max-width: 640px) {
            .tree-row { padding: 8px 10px; gap: 8px; }
            .tree-row .meta { display: none; }
            .tree-row .name { white-space: normal; }
            .tree-row .dl { padding: 5px 9px; }
        }
    </style>
</head>

<body>
    <div class="top">
        <a class="back" href="./">← Voltar</a>
        <button id="t" onclick="sw()"></button>
    </div>

    <div class="wrap">
        <div class="hero">
            <img src="./assets/logo.png" alt="Logo" class="hero-logo">
            <h1>Documentos Modelo</h1>
            <p>Arquivos disponibilizados diretamente pelo servidor.</p>
        </div>

        <div class="toolbar">
            <input id="search" type="text" placeholder="Buscar arquivo ou pasta..." oninput="render()">
        </div>

        <div class="panel" id="panel">
            <div class="state"><span class="spin">⏳</span><br>Carregando arquivos...</div>
        </div>

        <footer>© 2026 danih.morais</footer>
    </div>

    <script>
        // O GitHub Actions substitui este placeholder por uma string JSON válida.
        const API_URL = __API_URL_JSON__.replace(/\/+$/, "");
        const FILES_URL = `${API_URL}/files`;

        (function () {
            const theme = localStorage.getItem("app_theme") || "light";
            document.documentElement.dataset.theme = theme;
            updateThemeBtn();
        })();

        function sw() {
            const theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
            document.documentElement.dataset.theme = theme;
            localStorage.setItem("app_theme", theme);
            updateThemeBtn();
        }

        function updateThemeBtn() {
            document.getElementById("t").textContent =
                document.documentElement.dataset.theme === "dark" ? "☀️" : "🌙";
        }

        let entries = [];

        function normalizeEntry(item) {
            if (typeof item === "string") {
                return {
                    name: item.split("/").filter(Boolean).pop() || item,
                    path: item,
                    type: "file",
                    size: undefined,
                    url: null
                };
            }

            const path = item.path || item.relative_path || item.filepath || item.filename || item.name || "";
            const name = item.name || item.filename || (path.split("/").filter(Boolean).pop() || path);
            const type = item.type || item.kind || (item.is_dir || item.directory ? "tree" : "file");
            const url = item.url || item.download_url || item.href || null;

            return {
                name,
                path,
                type: type === "directory" || type === "folder" || type === "tree" ? "tree" : "file",
                size: item.size,
                url
            };
        }

        function extractEntries(data) {
            if (Array.isArray(data)) return data.map(normalizeEntry).filter(e => e.path || e.name);

            if (data && typeof data === "object") {
                const candidate = data.files || data.items || data.entries || data.results;
                if (Array.isArray(candidate)) return candidate.map(normalizeEntry).filter(e => e.path || e.name);
            }

            return [];
        }

        async function loadFiles() {
            if (!API_URL) {
                throw new Error("API_URL não foi configurada no deploy.");
            }

            const res = await fetch(FILES_URL, { cache: "no-store" });
            if (!res.ok) throw new Error(`Falha ao consultar o servidor (HTTP ${res.status}).`);

            const data = await res.json();
            entries = extractEntries(data);
            render();
        }

        function formatSize(bytes) {
            if (bytes === undefined || bytes === null || bytes === "") return "";
            const n = Number(bytes);
            if (!Number.isFinite(n)) return "";
            if (n < 1024) return `${n} B`;
            if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
            if (n < 1024 * 1024 * 1024) return `${(n / (1024 * 1024)).toFixed(1)} MB`;
            return `${(n / (1024 * 1024 * 1024)).toFixed(1)} GB`;
        }

        function fileUrl(entry) {
            if (entry.url) {
                if (/^https?:\/\//i.test(entry.url)) return entry.url;
                return `${API_URL}/${String(entry.url).replace(/^\/+/, "")}`;
            }

            const path = String(entry.path || entry.name).split("/").map(encodeURIComponent).join("/");
            return `${FILES_URL}/${path}`;
        }

        function createTreeNodes() {
            const root = { name: "", path: "", folders: new Map(), files: new Map() };

            const ensureFolder = (parent, name, path) => {
                if (!parent.folders.has(name)) {
                    parent.folders.set(name, {
                        name,
                        path,
                        folders: new Map(),
                        files: new Map()
                    });
                }
                return parent.folders.get(name);
            };

            entries.forEach(entry => {
                const normalizedPath = String(entry.path || entry.name || "").replace(/^\/+|\/+$/g, "");
                if (!normalizedPath) return;

                const parts = normalizedPath.split("/").filter(Boolean);
                if (!parts.length) return;

                let parent = root;
                const last = parts.length - 1;

                for (let i = 0; i < last; i++) {
                    const currentPath = parts.slice(0, i + 1).join("/");
                    parent = ensureFolder(parent, parts[i], currentPath);
                }

                if (entry.type === "tree") {
                    ensureFolder(parent, parts[last], normalizedPath);
                } else {
                    parent.files.set(parts[last], {
                        ...entry,
                        name: parts[last],
                        path: normalizedPath
                    });
                }
            });

            return root;
        }

        function nodeMatches(node, query) {
            if (!query) return true;
            if (node.name.toLowerCase().includes(query) || node.path.toLowerCase().includes(query)) return true;

            for (const file of node.files.values()) {
                if (file.name.toLowerCase().includes(query) || file.path.toLowerCase().includes(query)) return true;
            }

            for (const folder of node.folders.values()) {
                if (nodeMatches(folder, query)) return true;
            }

            return false;
        }

        function shouldShowFile(file, query) {
            return !query || file.name.toLowerCase().includes(query) || file.path.toLowerCase().includes(query);
        }

        function renderFolder(folder, depth, query, forceOpen) {
            if (query && !nodeMatches(folder, query)) return "";

            const folderId = `folder-${folder.path.replace(/[^a-zA-Z0-9_-]/g, "-") || "root"}`;
            const visibleChildren = [];

            const folders = Array.from(folder.folders.values())
                .sort((a, b) => a.name.localeCompare(b.name, "pt-BR"));

            folders.forEach(child => {
                const childHtml = renderFolder(child, depth + 1, query, forceOpen);
                if (childHtml) visibleChildren.push(childHtml);
            });

            const files = Array.from(folder.files.values())
                .filter(file => shouldShowFile(file, query))
                .sort((a, b) => a.name.localeCompare(b.name, "pt-BR"));

            files.forEach(file => visibleChildren.push(renderFile(file, depth + 1)));

            if (!visibleChildren.length) return "";

            const hasChildren = visibleChildren.length > 0;
            const open = forceOpen || !query ? false : true;

            return `
                <div class="tree-node">
                    <div class="tree-row folder"
                         data-folder="${escapeAttr(folderId)}"
                         style="padding-left:${14 + depth * 22}px"
                         onclick="toggleFolder(this, '${escapeAttr(folderId)}')">
                        <div class="expander" id="expander-${escapeAttr(folderId)}">${open ? "▾" : "▸"}</div>
                        <div class="icon">📁</div>
                        <div class="name" title="${escapeAttr(folder.path)}">${escapeHtml(folder.name)}</div>
                        <div class="meta">pasta</div>
                    </div>
                    <div class="children${open ? " open" : ""}" id="${escapeAttr(folderId)}">
                        ${visibleChildren.join("")}
                    </div>
                </div>`;
        }

        function renderFile(entry, depth) {
            const url = fileUrl(entry);

            return `
                <div class="tree-node">
                    <div class="tree-row file" style="padding-left:${14 + depth * 22}px">
                        <div class="expander"></div>
                        <div class="icon">📄</div>
                        <div class="name" title="${escapeAttr(entry.path || entry.name)}">${escapeHtml(entry.name)}</div>
                        <div class="meta">${formatSize(entry.size)}</div>
                        <a class="dl" href="${escapeAttr(url)}" download="${escapeAttr(entry.name)}" onclick="event.stopPropagation()">Baixar</a>
                    </div>
                </div>`;
        }

        function render() {
            const panel = document.getElementById("panel");
            const query = document.getElementById("search").value.toLowerCase().trim();
            const root = createTreeNodes();

            const folders = Array.from(root.folders.values())
                .filter(folder => !query || nodeMatches(folder, query))
                .sort((a, b) => a.name.localeCompare(b.name, "pt-BR"));

            const files = Array.from(root.files.values())
                .filter(file => shouldShowFile(file, query))
                .sort((a, b) => a.name.localeCompare(b.name, "pt-BR"));

            const html = [];
            folders.forEach(folder => html.push(renderFolder(folder, 0, query, Boolean(query))));
            files.forEach(file => html.push(renderFile(file, 0)));

            const result = html.filter(Boolean).join("");

            if (!result) {
                panel.innerHTML = '<div class="state">Nenhum arquivo ou pasta encontrado.</div>';
                return;
            }

            panel.innerHTML = `<div class="tree">${result}</div>`;
        }

        function toggleFolder(row, folderId) {
            const children = document.getElementById(folderId);
            const expander = document.getElementById(`expander-${folderId}`);
            if (!children || !expander) return;

            const open = children.classList.toggle("open");
            expander.textContent = open ? "▾" : "▸";
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, c => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[c]));
        }

        function escapeAttr(value) {
            return escapeHtml(value);
        }

        loadFiles().catch(err => {
            document.getElementById("panel").innerHTML = `
                <div class="state error">
                    ⚠️ Não foi possível carregar os arquivos.<br>
                    <small>${escapeHtml(err.message)}</small>
                </div>`;
        });
    </script>
</body>
</html>
